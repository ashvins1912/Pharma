# Redis 7 In-Memory Cache Configuration for Render Free Tier

# Network Bindings (Local IPC only within Docker container)
bind 127.0.0.1
port 6379
protected-mode no

# Memory Management
# 150MB cap ensures total container RAM usage stays comfortably under Render's 512MB limit
maxmemory 150mb
maxmemory-policy allkeys-lru

# Disable All Disk Persistence (Volatile in-memory cache, zero I/O latency)
save ""
appendonly no

# TCP & Performance Optimization
tcp-keepalive 300
timeout 0
databases 1
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
