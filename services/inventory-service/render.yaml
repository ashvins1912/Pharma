services:
  - type: web
    name: ashvin-pharmacy-inventory
    runtime: node
    rootDir: services/inventory-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: INVENTORY_MONGO_URI
        sync: false
      - key: INVENTORY_DB_NAME
        value: pharma_inventory
      - key: SERVICE_AUTH_SECRET
        sync: false
      - key: SERVICE_JWT_ISSUER
        value: ashvin-pharmacy
      - key: SERVICE_JWT_AUDIENCE
        value: inventory-service
      - key: INVENTORY_BATCH_SIZE
        value: 250
      - key: INVENTORY_WORKER_CONCURRENCY
        value: 1
      - key: INVENTORY_MAX_RETRIES
        value: 3
      - key: INVENTORY_IMPORT_MAX_FILE_BYTES
        value: 104857600
      - key: INVENTORY_IMPORT_STORAGE
        value: /var/data/imports
      - key: INVENTORY_CORS_ORIGIN
        value: ""
    disk:
      name: inventory-imports
      mountPath: /var/data
      sizeGB: 2
