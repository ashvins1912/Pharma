name: Tenant security regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/tenant-isolated-pharmacy-checkout]

jobs:
  tenant-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Run full repository tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Type-check frontend
        run: npm run lint
