name: Private DevOps Adapter CI
on:
  pull_request:
    paths:
      - 'services/private-devops-adapter/**'
      - 'backend/gateway/routes/adminDevOps.js'
  push:
    branches: [feat/private-devops-provider-adapter]
    paths:
      - 'services/private-devops-adapter/**'
      - 'backend/gateway/routes/adminDevOps.js'
jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/private-devops-adapter/package.json
      - name: Install adapter dependencies
        working-directory: services/private-devops-adapter
        run: npm install --ignore-scripts
      - name: Syntax check
        run: node --check services/private-devops-adapter/server.js
      - name: Adapter tests
        working-directory: services/private-devops-adapter
        run: npm test
