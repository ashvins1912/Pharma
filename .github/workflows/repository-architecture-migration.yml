name: Repository architecture migration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: !contains(github.event.head_commit.message, 'architecture: complete independent-service migration')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Skip after migration commits
        run: |
          set -euo pipefail
          message="$(git log -1 --pretty=%s)"
          if [[ "$message" == "architecture: complete independent-service migration" || "$message" == "chore: remove temporary architecture migration workflow" ]]; then
            echo "Migration already applied."
            exit 0
          fi

      - name: Move standalone services and remove duplicates
        run: |
          set -euo pipefail

          mkdir -p services

          if [ -d backend/services/inventory-service ]; then
            git mv backend/services/inventory-service services/inventory-service
          fi

          if [ -d backend/services/order-service ]; then
            git mv backend/services/order-service services/order-service
          fi

          git rm -rf --ignore-unmatch backend/inventory-service
          git rm -rf --ignore-unmatch backend/services/prescription-service
          git rm -f --ignore-unmatch services/prescription-service/service.test.js

          # Remove the legacy combined frontend/API deployment surface.
          git rm -rf --ignore-unmatch src
          git rm -rf --ignore-unmatch api
          git rm -f --ignore-unmatch server.ts index.html vite.config.js
          git rm -f --ignore-unmatch tailwind.config.js postcss.config.js
          git rm -f --ignore-unmatch .env.vercel.example
          git rm -f --ignore-unmatch render.yaml

      - name: Rewrite project configuration
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.workspaces = ['frontend', 'api-gateway', 'backend', 'services/*'];
          pkg.scripts = {
            dev: 'node scripts/dev.js',
            'dev:frontend': 'npm --workspace frontend run dev',
            'dev:gateway': 'npm --workspace api-gateway run dev',
            'dev:backend': 'npm --workspace backend run dev',
            'build': 'npm --workspace frontend run build',
            'lint': 'npm --workspace frontend run lint',
            'test': 'npm --workspace api-gateway test && npm --workspace backend test && npm --workspace services/inventory-service test && npm --workspace services/order-service test',
            'admin:promote': 'npm --workspace backend run admin:promote',
            'admin:bootstrap': 'node scripts/bootstrap-super-admin.mjs',
            'tenant:create': 'node scripts/create-tenant.mjs'
          };
          delete pkg.dependencies;
          delete pkg.devDependencies;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

          python3 <<'PY'
          from pathlib import Path

          # Backend gateway compatibility imports now point at the canonical service.
          p = Path('backend/gateway/routes/inventory.js')
          if p.exists():
              text = p.read_text()
              text = text.replace('../../services/inventory-service/', '../../../services/inventory-service/')
              p.write_text(text)

          # The frontend proxy must target the public API Gateway, not the legacy backend port.
          p = Path('frontend/vite.config.js')
          text = p.read_text()
          text = text.replace("http://localhost:3001", "http://localhost:8080")
          p.write_text(text)

          # Make the canonical service documentation refer to its colocated Blueprint.
          for name in ('inventory-service', 'order-service'):
              p = Path(f'services/{name}/README.md')
              if p.exists():
                  text = p.read_text()
                  text = text.replace('../../render.yaml', 'render.yaml')
                  text = text.replace('the standalone Gateway issues', 'the public API Gateway issues')
                  text = text.replace('main application\'s catalog, order fulfillment, Medicine Request conversion, and legacy admin import still use the backend datastore;',
                                      'legacy application workflows still use the backend until their domain cutover is completed;')
                  p.write_text(text)
          PY

      - name: Create independent deployment metadata
        run: |
          set -euo pipefail

          cat > frontend/render.yaml <<'YAML'
          services:
            - type: web
              name: ashvin-pharmacy-frontend
              runtime: static
              buildCommand: npm install && npm run build
              staticPublishPath: ./frontend/dist
              envVars:
                - key: VITE_API_URL
                  sync: false
                - key: VITE_SUPABASE_URL
                  sync: false
                - key: VITE_SUPABASE_ANON_KEY
                  sync: false
                - key: VITE_FRONTEND_URL
                  sync: false
                - key: VITE_GOOGLE_MAPS_API_KEY
                  sync: false
              routes:
                - type: rewrite
                  source: /*
                  destination: /index.html
          YAML

          cat > frontend/.env.example <<'ENV'
          VITE_API_URL=/api
          VITE_DEV_API_PROXY=http://localhost:8080
          VITE_FRONTEND_URL=http://localhost:3000
          VITE_SUPABASE_URL=
          VITE_SUPABASE_ANON_KEY=
          VITE_GOOGLE_MAPS_API_KEY=
          ENV

          cat > api-gateway/.env.example <<'ENV'
          NODE_ENV=development
          PORT=8080
          BACKEND_API_URL=http://localhost:8090
          INVENTORY_SERVICE_URL=http://localhost:5100
          ORDER_SERVICE_URL=http://localhost:5200
          CORS_ALLOWED_ORIGINS=http://localhost:3000
          GATEWAY_AUTH_SECRET=
          SERVICE_AUTH_SECRET=
          SERVICE_JWT_ISSUER=ashvin-pharmacy
          SERVICE_JWT_AUDIENCE=inventory-service
          ORDER_SERVICE_JWT_AUDIENCE=order-service
          PROXY_TIMEOUT_MS=120000
          AUTH_TIMEOUT_MS=15000
          HEALTH_CHECK_ENABLED=true
          HEALTH_CHECK_INTERVAL_MINUTES=15
          HEALTH_CHECK_TIMEOUT_MS=5000
          HEALTH_CHECK_RUN_ON_STARTUP=true
          ENV

          cat > services/inventory-service/.env.example <<'ENV'
          NODE_ENV=development
          INVENTORY_SERVICE_PORT=5100
          INVENTORY_MONGO_URI=mongodb://localhost:27017
          INVENTORY_DB_NAME=pharma_inventory
          SERVICE_AUTH_SECRET=
          SERVICE_JWT_ISSUER=ashvin-pharmacy
          SERVICE_JWT_AUDIENCE=inventory-service
          INVENTORY_BATCH_SIZE=250
          INVENTORY_WORKER_CONCURRENCY=1
          INVENTORY_MAX_RETRIES=3
          INVENTORY_IMPORT_MAX_FILE_BYTES=104857600
          INVENTORY_IMPORT_STORAGE=./data/imports
          INVENTORY_CORS_ORIGIN=
          ENV

          cat > services/order-service/.env.example <<'ENV'
          NODE_ENV=development
          ORDER_SERVICE_PORT=5200
          ORDER_MONGO_URI=mongodb://localhost:27017
          ORDER_DB_NAME=pharma_orders
          SERVICE_AUTH_SECRET=
          SERVICE_JWT_ISSUER=ashvin-pharmacy
          ORDER_SERVICE_JWT_AUDIENCE=order-service
          SERVICE_JWT_AUDIENCE=inventory-service
          INVENTORY_SERVICE_URL=http://localhost:5100
          PRESCRIPTION_SERVICE_URL=http://localhost:8000
          PRESCRIPTION_SERVICE_JWT_AUDIENCE=prescription-service
          PRESCRIPTION_RECONCILIATION_INTERVAL_MS=10000
          PRESCRIPTION_RECONCILIATION_BATCH_SIZE=20
          ENV

          cat > services/prescription-service/.env.example <<'ENV'
          ENVIRONMENT=development
          PORT=8000
          MONGO_URI=mongodb://localhost:27017
          PRESCRIPTION_DB_NAME=pharma_prescriptions
          PRESCRIPTION_ENCRYPTION_KEY=
          SERVICE_AUTH_SECRET=
          SERVICE_JWT_ISSUER=ashvin-pharmacy
          SERVICE_JWT_AUDIENCE=prescription-service
          PRESCRIPTION_MAX_RETRIES=3
          WORKER_ID=rx-worker-1
          PROCESSING_LEASE_SECONDS=600
          HEARTBEAT_INTERVAL_SECONDS=45
          ENV

          cat > services/prescription-service/README.md <<'MD'
          # Prescription Service

          The canonical prescription domain service. It is a standalone Python/FastAPI
          API plus a background worker. No Node.js prescription implementation exists
          in the repository.

          ## Local

          API:

          ```bash
          cd services/prescription-service
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          uvicorn main:app --host 0.0.0.0 --port 8000
          ```

          Worker:

          ```bash
          python -m app.workers
          ```

          The API and worker share the same MongoDB database and encryption/auth
          configuration. The worker consumes durable processing jobs created by the API.

          ## Deployment

          Use the colocated `render.yaml`. The API should be a private Render service
          in production because browser traffic goes through the API Gateway/backend
          authorization boundary. The worker is a Render background worker.

          Required production secrets:
          - `MONGO_URI`
          - `PRESCRIPTION_ENCRYPTION_KEY` (>= 32 characters; never rotate casually)
          - `SERVICE_AUTH_SECRET` (>= 32 characters)

          ## Boundary

          The service owns prescription upload, OCR/NLP extraction, processing state,
          review, approval/rejection, replacement, audit, and durable job processing.
          Order/Medicine Request services consume this API over HTTP and never import
          prescription implementation code.
          MD

          cat > docs/architecture/independent-deployment.md <<'MD'
          # Independent Deployment Architecture

          ## Canonical repository layout

          ```text
          Pharma/
          ├── frontend/                         # the only browser application
          ├── api-gateway/                      # the only public API gateway
          ├── backend/                          # platform API / orchestration boundary
          └── services/
              ├── inventory-service/            # standalone inventory authority
              ├── order-service/                # standalone order authority
              └── prescription-service/        # standalone prescription API + worker
          ```

          There is no root Vite application, no root Express/Vercel adapter, no second
          frontend tree, and no legacy Node prescription service.

          ## Runtime topology

          ```text
          Browser
             |
             v
          Frontend (static)
             |
             v
          API Gateway (public)
             |
             +----------------------+
             |                      |
             v                      v
          Backend              Inventory Service
          (private)                  |
             |                       +--> Inventory MongoDB
             |
             +--> Order Service ------> Inventory Service
             |        |
             |        +--> Order MongoDB
             |
             +--> Prescription Service
                      |
                      +--> Prescription MongoDB
                      +--> Prescription Worker
          ```

          The Gateway is the only browser-facing API boundary. Service URLs and service
          JWTs are never exposed to the frontend.

          ## Routing rule

          Public versioned routes that have a standalone authoritative service are
          routed by `api-gateway/src/serviceRoutes.js`:
          - `/api/v1/inventory/*` -> Inventory Service
          - `/api/v1/orders/*` -> Order Service

          Legacy/compound workflows continue through the backend until the entire
          workflow is extracted. This is intentional: the Gateway is a router, not a
          business-logic layer.

          Prescription processing remains independently deployable but is called by
          the backend/Order workflow where PUID/Medicine Request authorization requires
          platform context. Directly exposing prescription upload through the Gateway
          would weaken PUID ownership checks, so it is not proxied as a browser API
          until that authorization is service-owned.

          ## Deployment model

          Each deployable component can be deployed independently from its own
          directory/Blueprint:
          - `frontend/render.yaml`
          - `api-gateway/render.yaml`
          - `backend/render.yaml`
          - `services/inventory-service/render.yaml`
          - `services/order-service/render.yaml`
          - `services/prescription-service/render.yaml`

          For Render production, prefer private services for backend/domain APIs and
          a public static site + public Gateway. Use Render private-network addresses
          for internal calls and retain service JWT authorization as defense in depth.

          ## Local startup

          Root development starts only the three platform processes:

          ```bash
          npm install
          npm run dev
          ```

          This starts:
          - frontend on 3000
          - Gateway on 8080
          - backend on 8090

          Standalone domain services are started separately only when their workflows
          are being developed:

          ```bash
          npm --workspace services/inventory-service run dev
          npm --workspace services/order-service run dev

          cd services/prescription-service
          uvicorn main:app --host 0.0.0.0 --port 8000
          python -m app.workers
          ```
          MD

      - name: Update Gateway to explicit service mapping
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('api-gateway/src/config.js')
          text = p.read_text()

          text = text.replace(
              "    orderServiceUrl,\n",
              "    orderServiceUrl,\n"
          )
          text = text.replace(
              "      ...(orderServiceUrl ? [{ name: 'order-service', baseUrl: orderServiceUrl, healthPath: '/ready', critical: false }] : [])\n",
              "      ...(orderServiceUrl ? [{ name: 'order-service', baseUrl: orderServiceUrl, healthPath: '/ready', critical: false }] : [])\n"
          )
          p.write_text(text)

          p = Path('api-gateway/README.md')
          text = p.read_text()
          text = re.sub(
              r'legacy API traffic to the private backend API\.',
              'legacy/compound API traffic to the private backend API while authoritative versioned service routes are sent directly to their private domain services.',
              text,
              count=1
          )
          text = text.replace(
              'Inventory returns a controlled unavailable response until its service URL is configured.',
              'Inventory and Order return controlled unavailable responses until their service URLs are configured.'
          )
          p.write_text(text)
          PY

      - name: Make standalone service deployments private
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          for name in ('inventory-service', 'order-service'):
              p = Path(f'services/{name}/render.yaml')
              text = p.read_text()
              text = text.replace('  - type: web\n', '  - type: pserv\n', 1)
              p.write_text(text)

          p = Path('services/prescription-service/render.yaml')
          text = p.read_text()
          text = text.replace('  - type: web\n', '  - type: pserv\n', 1)
          p.write_text(text)
          PY

      - name: Refresh documentation references
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'backend/services/inventory-service': 'services/inventory-service',
              'backend/services/order-service': 'services/order-service',
              'backend/services/prescription-service': 'services/prescription-service'
          }

          for p in Path('docs').rglob('*'):
              if p.is_file() and p.suffix in {'.md', '.txt'}:
                  text = p.read_text(errors='ignore')
                  new = text
                  for old, replacement in replacements.items():
                      new = new.replace(old, replacement)
                  if new != text:
                      p.write_text(new)
          PY

      - name: Validate no duplicate standalone implementations remain
        run: |
          set -euo pipefail

          test ! -d src
          test ! -d api
          test ! -d backend/inventory-service
          test ! -d backend/services/inventory-service
          test ! -d backend/services/order-service
          test ! -d backend/services/prescription-service
          test -d frontend
          test -d services/inventory-service
          test -d services/order-service
          test -d services/prescription-service

          if grep -RIn --exclude-dir=.git --exclude-dir=node_modules \
              "backend/services/inventory-service\|backend/services/order-service\|backend/services/prescription-service" .; then
            echo "Legacy standalone service paths remain."
            exit 1
          fi

      - name: Refresh root lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit migration
        run: |
          set -euo pipefail

          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi

          git commit -m "architecture: complete independent-service migration"

          git rm -f .github/workflows/repository-architecture-migration.yml
          git commit -m "chore: remove temporary architecture migration workflow"

          git push origin HEAD:${{ github.head_ref }}
