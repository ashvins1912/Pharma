services:
  - type: web
    name: prescription-service-api
    runtime: python
    rootDir: prescription-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
  - type: worker
    name: prescription-service-worker
    runtime: python
    rootDir: prescription-service
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers
