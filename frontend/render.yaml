services:
  - type: web
    name: ashvin-pharmacy-frontend
    runtime: static
    buildCommand: cd frontend && npm install --include=dev --workspaces=false && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: /api
      - key: VITE_API_GATEWAY_URL
        value: https://pharma-api-gateway.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_FRONTEND_URL
        value: https://pharma-ui.onrender.com
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    headers:
      # Keep the SPA entry point fresh across deployments; Vite assets are immutable.
      - path: /
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # Keep browser API calls same-origin while routing them through the
      # public API Gateway, preserving first-party session-cookie behavior.
      - type: rewrite
        source: /api/v1/auth/*
        destination: https://pharma-api-gateway.onrender.com/api/v1/auth/*
      - type: rewrite
        source: /api/v1/inventory/*
        destination: https://pharma-api-gateway.onrender.com/api/v1/inventory/*
      - type: rewrite
        source: /api/*
        destination: https://pharma-api-gateway.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
