services:
  - type: web
    name: ashvin-pharmacy-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: /api
      - key: VITE_API_GATEWAY_URL
        value: https://pharma-api-gateway.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_FRONTEND_URL
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
    routes:
      # Keep browser API calls same-origin while routing them through the
      # public API Gateway. This also preserves legacy /api/orders/*
      # prescription URLs stored on existing orders.
      # Route authentication endpoints explicitly before the general API rule.
      # This prevents a stale/broader SPA fallback rule from serving index.html
      # for /api/v1/auth/* requests such as login, refresh, and /auth/me.
      - type: rewrite
        source: /api/v1/auth/*
        destination: https://pharma-api-gateway.onrender.com/api/v1/auth/*
      - type: rewrite
        source: /api/*
        destination: https://pharma-api-gateway.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
