services:
  - type: web
    name: ashvin-pharmacy-api-gateway
    runtime: node
    rootDir: api-gateway
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_API_URL
        sync: false
      - key: GATEWAY_AUTH_SECRET
        sync: false
      - key: SERVICE_AUTH_SECRET
        sync: false
      - key: SERVICE_JWT_ISSUER
        value: ashvin-pharmacy
      - key: SERVICE_JWT_AUDIENCE
        value: inventory-service
      - key: ORDER_SERVICE_JWT_AUDIENCE
        value: order-service
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: ORDER_SERVICE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PROXY_TIMEOUT_MS
        value: 120000
      - key: AUTH_TIMEOUT_MS
        value: 15000
