services:
  - type: web
    name: ashvin-pharmacy-api-gateway
    runtime: node
    rootDir: api-gateway
    buildCommand: npm install
    startCommand: npm start
    numInstances: 1
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      # Backend is a Render private service; use the private-network DNS name.
      - key: BACKEND_API_URL
        value: http://ashvin-pharmacy-platform:10000
      - key: PHARMA_JWT_PUBLIC_KEY
        sync: false
      - key: PHARMA_JWT_ISSUER
        value: pharma-auth
      - key: PHARMA_JWT_AUDIENCE
        value: pharma-api
      - key: GATEWAY_AUTH_SECRET
        sync: false
      - key: SERVICE_AUTH_SECRET
        sync: false
      - key: SERVICE_JWT_ISSUER
        value: ashvin-pharmacy
      - key: SERVICE_JWT_AUDIENCE
        value: inventory-service
      - key: ORDER_SERVICE_JWT_AUDIENCE
        value: order-service
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: ORDER_SERVICE_URL
        sync: false
      - key: PRESCRIPTION_SERVICE_URL
        sync: false
      - key: CUSTOMER_SERVICE_URL
        sync: false
      - key: CUSTOMER_SERVICE_JWT_AUDIENCE
        value: customer-service
      - key: PRESCRIPTION_SERVICE_JWT_AUDIENCE
        value: prescription-service
      - key: CORS_ALLOWED_ORIGINS
        value: https://pharma-ui.onrender.com
      - key: PROXY_TIMEOUT_MS
        value: 120000
      - key: AUTH_TIMEOUT_MS
        value: 15000
      - key: LOGGING_ENABLED
        value: "true"
      - key: HEALTH_CHECK_ENABLED
        value: "true"
      - key: HEALTH_CHECK_INTERVAL_MINUTES
        value: 15
      - key: HEALTH_CHECK_TIMEOUT_MS
        value: 5000
      - key: HEALTH_CHECK_RUN_ON_STARTUP
        value: "true"
