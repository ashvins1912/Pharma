services:
  - type: web
    name: ashvin-pharma-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm --workspace backend install
    startCommand: node backend/server-entry.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MONGO_URI
        sync: false

  - type: web
    name: ashvin-pharma-websocket
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node backend/services/websocket/WebsocketServer.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: ashvin-pharma-prescription
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node backend/services/prescription-verification/PrescriptionVerificationService.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

  - type: web
    name: ashvin-pharma-cache
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./services/caching-service/Dockerfile
    dockerContext: ./services/caching-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: REDIS_URL
        value: redis://127.0.0.1:6379/0

  - type: web
    name: ashvin-pharma-frontend
    env: static
    plan: free
    buildCommand: npm --workspace frontend install && npm --workspace frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ashvin-pharma-api.onrender.com
      - key: VITE_WS_URL
        value: https://ashvin-pharma-websocket.onrender.com
