services:
  - type: web
    name: ashvin-pharma-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm --workspace backend install
    startCommand: node backend/server-entry.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://pharma-ui.onrender.com
      - key: MONGO_URI
        sync: false
      - key: CACHE_SERVICE_URL
        value: http://ashvin-pharma-shared-cache:8080
      - key: CACHE_SERVICE_TOKEN
        sync: false

  - type: web
    name: ashvin-pharma-websocket
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm --workspace services/websocket-service start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://pharma-ui.onrender.com
      - key: WS_HEARTBEAT_INTERVAL_MS
        value: 25000
      - key: WS_PING_INTERVAL_MS
        value: 25000
      - key: WS_PING_TIMEOUT_MS
        value: 20000
      - key: CACHE_SERVICE_URL
        value: http://ashvin-pharma-shared-cache:8080
      - key: CACHE_SERVICE_TOKEN
        sync: false
      - key: PHARMA_JWT_PUBLIC_KEY
        sync: false
      - key: PHARMA_JWT_ISSUER
        value: pharma-auth
      - key: PHARMA_JWT_AUDIENCE
        value: pharma-api

  - type: web
    name: ashvin-pharma-prescription
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node backend/services/prescription-verification/PrescriptionVerificationService.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

  - type: web
    name: ashvin-pharma-shared-cache
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./services/caching-service/Dockerfile
    dockerContext: ./services/caching-service
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: REDIS_URL
        value: redis://127.0.0.1:6379/0
      - key: CACHE_SERVICE_TOKEN
        sync: false


  - type: web
    name: ashvin-pharma-frontend
    env: static
    plan: free
    buildCommand: npm --workspace frontend install && npm --workspace frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ashvin-pharma-api.onrender.com
      - key: VITE_WS_URL
        value: https://ashvin-pharma-websocket.onrender.com
