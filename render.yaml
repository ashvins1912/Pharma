services:
  - type: web
    name: ashvin-pharmacy
    runtime: node
    buildCommand: npm install && npm --prefix frontend install && npm run build
    startCommand: npm run start:legacy
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MONGO_URI
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DEMO_CUSTOMER_ENABLED
        sync: false
      - key: DEMO_CUSTOMER_JWT_SECRET
        sync: false
      - key: DEMO_CUSTOMER_EMAIL
        sync: false
      - key: DEMO_CUSTOMER_NAME
        sync: false
      - key: DEMO_CUSTOMER_MOBILE
        sync: false
      - key: DEMO_ADMIN_ENABLED
        sync: false
      - key: DEMO_ADMIN_INSTANT_ACCESS_ENABLED
        sync: false
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_ADMIN_JWT_SECRET
        sync: false
      - key: VITE_DEMO_ADMIN_ENABLED
        sync: false
      - key: VITE_DEMO_CUSTOMER_ENABLED
        sync: false
      - key: VITE_INSTANT_DEMO_ACCESS_ENABLED
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: INVENTORY_IMPORT_BATCH_SIZE
        sync: false
      - key: INVENTORY_IMPORT_CONCURRENCY
        sync: false
      - key: INVENTORY_IMPORT_JOB_CONCURRENCY
        sync: false
      - key: INVENTORY_IMPORT_MAX_FILE_BYTES
        sync: false
      - key: GATEWAY_AUTH_SECRET
        sync: false
      - key: SERVICE_JWT_ISSUER
        value: ashvin-pharmacy