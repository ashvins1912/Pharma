services:
  - type: static
    name: ashvin-pharmacy-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_ENV
        value: production
    routes:
      - type: rewrite
        source: /api/v1/auth/*
        destination: https://pharma-api-gateway.onrender.com/api/v1/auth/*
      - type: rewrite
        source: /api/*
        destination: https://pharma-api-gateway.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
