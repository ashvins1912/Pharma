services:
  - type: web
    name: ashvin-pharma-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm --workspace backend install
    startCommand: node backend/server-entry.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MONGO_URI
        sync: false

  - type: web
    name: ashvin-pharma-websocket
    runtime: node
    rootDir: services/websocket-service
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://pharma-ui.onrender.com
      - key: WS_HEARTBEAT_INTERVAL_MS
        value: 25000
      - key: WS_PING_INTERVAL_MS
        value: 25000
      - key: WS_PING_TIMEOUT_MS
        value: 20000

  - type: web
    name: ashvin-pharma-prescription
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node backend/services/prescription-verification/PrescriptionVerificationService.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

  - type: redis
    name: ashvin-pharma-cache
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0
        description: Temporary broad access; restrict to trusted service egress ranges when available

  - type: web
    name: ashvin-pharma-frontend
    env: static
    plan: free
    buildCommand: npm --workspace frontend install && npm --workspace frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ashvin-pharma-api.onrender.com
      - key: VITE_WS_URL
        value: https://ashvin-pharma-websocket.onrender.com
