services:
  - type: web
    name: ashvin-pharma-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm --workspace backend install
    startCommand: node backend/server-entry.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://pharma-ui.onrender.com
      - key: MONGO_URI
        sync: false
      # Preserve the current value: it decrypts existing AES-GCM fields.
      - key: ENCRYPTION_SECRET_KEY
        sync: false
      - key: CACHE_SERVICE_URL
        value: https://caching-v0et.onrender.com
      - key: CACHE_SERVICE_TOKEN
        sync: false
      # Cloudinary credentials are backend-only secrets. Enter them in Render.
      - key: IMAGE_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: pharma/catalog
      - key: IMAGE_MAX_BYTES
        value: 5242880
      - key: IMAGE_MAX_PIXELS
        value: 25000000

  - type: web
    name: ashvin-pharma-websocket
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm --workspace services/websocket-service start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: https://pharma-ui.onrender.com
      - key: WS_HEARTBEAT_INTERVAL_MS
        value: 25000
      - key: WS_PING_INTERVAL_MS
        value: 25000
      - key: WS_PING_TIMEOUT_MS
        value: 20000
      - key: CACHE_SERVICE_URL
        value: https://caching-v0et.onrender.com
      - key: CACHE_SERVICE_TOKEN
        sync: false
      - key: PHARMA_JWT_PUBLIC_KEY
        sync: false
      - key: PHARMA_JWT_ISSUER
        value: pharma-auth
      - key: PHARMA_JWT_AUDIENCE
        value: pharma-api

  - type: web
    name: ashvin-pharma-prescription
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node backend/services/prescription-verification/PrescriptionVerificationService.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

  - type: web
    name: ashvin-pharma-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: /api
      - key: VITE_API_GATEWAY_URL
        value: https://pharma-api-gateway.onrender.com
      - key: VITE_WS_URL
        value: https://websockt.onrender.com

    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(self), geolocation=(self), microphone=()
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    routes:
      # Route API traffic through the API Gateway before the SPA fallback.
      - type: rewrite
        source: /api/v1/auth/*
        destination: https://pharma-api-gateway.onrender.com/api/v1/auth/*
      - type: rewrite
        source: /api/v1/inventory/*
        destination: https://pharma-api-gateway.onrender.com/api/v1/inventory/*
      - type: rewrite
        source: /api/*
        destination: https://pharma-api-gateway.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
