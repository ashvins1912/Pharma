services:
  - type: web
    name: ashvin-pharma-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm --workspace backend install
    startCommand: node backend/server-entry.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: MONGO_URI
        sync: false

  - type: web
    name: ashvin-pharma-websocket
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node backend/services/websocket/WebsocketServer.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WS_PORT
        value: 4000
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: ashvin-pharma-prescription
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node backend/services/prescription-verification/PrescriptionVerificationService.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

  - type: redis
    name: ashvin-pharma-cache
    region: oregon
    plan: starter # Upgraded from 'free' to support IP allowlisting
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/0 # Replace this with your actual trusted CIDR blocks (e.g., your API server's outbound IP)
        description: Trusted network access

  - type: web
    name: ashvin-pharma-frontend
    env: static
    plan: free
    buildCommand: npm --workspace frontend install && npm --workspace frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ashvin-pharma-api.onrender.com
      - key: VITE_WS_URL
        value: https://ashvin-pharma-websocket.onrender.com
