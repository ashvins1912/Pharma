services:
  - type: pserv
    name: ashvin-pharmacy-api
    runtime: node
    rootDir: backend
    # The backend imports source files from services/inventory-service. ESM
    # resolves their packages from that service directory, so install there.
    # Use npm install because this deployment must not depend on an untracked lockfile.
    buildCommand: npm install --prefix ../services/inventory-service --omit=dev && npm install --omit=dev && node --input-type=module -e "await import('../services/inventory-service/src/models.js')"
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GATEWAY_AUTH_SECRET
        sync: false
      - key: SERVICE_JWT_ISSUER
        value: ashvin-pharmacy
      # Admin password login is enabled, while anonymous instant access stays off.
      # Set DEMO_ADMIN_PASSWORD and DEMO_ADMIN_JWT_SECRET in Render's Environment UI.
      - key: DEMO_ADMIN_ENABLED
        value: "true"
      - key: DEMO_ADMIN_INSTANT_ACCESS_ENABLED
        value: "false"
      - key: DEMO_ADMIN_EMAIL
        value: ashvinsingh25@gmail.com
      - key: DEMO_ADMIN_USER_ID
        value: admin
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_ADMIN_JWT_SECRET
        sync: false
      - key: DEMO_CUSTOMER_ENABLED
        value: "false"
      # Keep disabled until MongoDB transaction support and business attempt policy are verified.
      - key: WHATSAPP_DELIVERY_TRACKING_ENABLED
        value: "false"
      - key: MONGO_TRANSACTIONS_CONFIRMED
        value: "false"
      - key: DELIVERY_ACTION_BASE_URL
        sync: false
      - key: DELIVERY_MAX_ATTEMPTS
        sync: false
      - key: SYSTEM_SECRET_KEY
        sync: false
      - key: DELIVERY_EVENT_SECRET
        sync: false
