services:
  - type: web
    name: ashvin-pharmacy-order
    runtime: node
    rootDir: services/order-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: ORDER_MONGO_URI
        sync: false
      - key: ORDER_DB_NAME
        value: pharma_orders
      - key: SERVICE_AUTH_SECRET
        sync: false
      - key: SERVICE_JWT_ISSUER
        value: ashvin-pharmacy
      - key: ORDER_SERVICE_JWT_AUDIENCE
        value: order-service
      - key: INVENTORY_SERVICE_URL
        sync: false
      - key: SERVICE_JWT_AUDIENCE
        value: inventory-service
